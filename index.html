<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app pinta bajo la muesca y la barra del iPhone -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FuelMates — la gasolina del viaje, repartida</title>
    <meta
      name="description"
      content="Reparte el coste del combustible de un viaje entre los ocupantes del coche."
    />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- El color de la barra del navegador acompaña al tema del sistema -->
    <meta
      name="theme-color"
      content="#0d9488"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1512"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FuelMates" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
